<!DOCTYPE html>
<html>
<head>
  <title>Show me Tech</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main>
    <div class="title-container">
      <div class="title-border">
        <span class="title-text">Show Tech 3 Ways: Area 3</span>
        <img src="images/wifi_logo.png" class="wifi-logo">
      </div>
    </div>

    <div class="carousel-container">
      <!-- Minnie Section -->
      <div class="minnie-container">
        <!-- Left side of the carousel non-intractive -->
        <div class="left-non-interactive-container">
          <div class="minnie-full-setup-container">
            <span>Minnie Server Full Setup:</span>
            <img src="Images/full_setup.png" class="minnie-setup-img">
            <p>The laptop connects to the router over Wi-Fi to access a website hosted on the desktop server. The router transfers requests and responses between the laptop and server, allowing users to browse the website through the local network.</p>
          </div>

          <div class="cartoon-full-setup-container">
            <img src="Images/cartoon_full_setup.png" class="cartoon-img">
          </div>
        </div>

        <!-- Left side of the carousel intractive -->
        <div class="right-interactive-container">
          <div class="router-container">
            <img src="Images/router.png" class="router">
          </div>
          <!-- Arrows are 1 to 4 from left to right respectively -->
          <div class="arrow-container">
            <div class="laptop-and-router">
              <div class="arrow-1"></div>
              <div class="arrow-2"></div>
            </div>

            <div class="minnie-and-router">
              <div class="arrow-3"></div>
              <div class="arrow-4"></div>
            </div>
          </div>

          <div class="laptop-minnie-container">
            <img src="Images/laptop.png" class="laptop">
            <img src="Images/minnie.png" class="minnie">
          </div>
        </div>
        

      </div>




      <!-- Buttons -->
      <div class="button-container">
        <button class="left-button">Previous</button>
        <button class="right-button">Next</button>
      </div>
    </div>


    <!-- ARROW TEST -->

    <div class="test"></div>







    
  </main>

</body>

</html>
