<!DOCTYPE html>
<html>
<head>
  <title>Show me Tech</title>
  <link rel="stylesheet" href="destinations.css">
</head>
<body>
  <main class="card">
    <h1 id="dest-name"></h1>

    <div class="image-frame">
      <img id="dest-image" alt="">
    </div>

    <p id="dest-description"></p>

    <div class="facts">
      <div class="fact">
        <span class="fact-label">Location</span>
        <span class="fact-value" id="dest-location"></span>
      </div>
      <div class="fact">
        <span class="fact-label">Average Daily Visitors</span>
        <span class="fact-value" id="dest-daily"></span>
      </div>
      <div class="fact">
        <span class="fact-label">Average Yearly Visitors</span>
        <span class="fact-value" id="dest-yearly"></span>
      </div>
    </div>
  </main>

  <script src="destinations.js"></script>
  <script>
    const id = new URLSearchParams(window.location.search).get("id");
    const d = destinations[id];

    if (d) {
      document.title = d.name;
      document.getElementById("dest-name").textContent = d.name;
      const img = document.getElementById("dest-image");
      img.src = d.image;
      img.alt = d.alt;
      document.getElementById("dest-description").textContent = d.description;
      document.getElementById("dest-location").textContent = d.location;
      document.getElementById("dest-daily").textContent = d.dailyVisitors;
      document.getElementById("dest-yearly").textContent = d.yearlyVisitors;
    } else {
      document.getElementById("dest-name").textContent = "Destination not found";
    }
  </script>
</body>
</html>
