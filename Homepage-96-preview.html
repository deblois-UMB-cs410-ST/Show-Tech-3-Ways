<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShowTech | 96 Destinations Preview</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07172e;
    color: white;
}

h1 { text-align: center; }

.destination-background {
    position: relative;
    width: 100%;
}

.destination-row {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 4px;
    margin-bottom: 4px;
}

.destination-row a {
    display: block;
    min-width: 0;
}

.destination-row img {
    display: block;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
}

.destination-row img:hover {
    outline: 3px solid #ffd166;
    outline-offset: -3px;
}

/* Two larger sections in the center */
.teammate-overlay {
    position: absolute;
    z-index: 10;

    top: 10%;
    bottom: 10%;
    left: 10%;
    right: 10%;

    width: auto;
    transform: none;

    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
}
.teammate-panel {
    background: #e8eef3;
    color: #263445;
    border: 2px solid #30465c;
    border-radius: 10px;
    padding: 24px;
    min-height: 350px;
    box-shadow: 0 8px 20px rgba(0,0,0,.3);
    height: 100%;
    min-height: 0;

}
@media (max-width: 650px) {
    .teammate-overlay {
        left: 12%;
        width: 76%;
        gap: 6px;
    }
/* Teammate content inside the centered panels */

.teammate-panel {
    overflow: auto;
}

.teammate-panel .carousel-area2,
.teammate-panel .carousel-area3 {
    width: 100%;
    height: 100%;
}

.teammate-panel .area3-photo img {
    display: block;
    width: 100%;
    height: 250px;
    object-fit: cover;
    border-radius: 8px;
}

.teammate-panel .area3-description {
    padding: 12px 0;
}

.teammate-panel .area3-button {
    display: flex;
    justify-content: space-between;
    gap: 12px;
}
}
/* Keep both middle sections exactly equal */

.teammate-overlay {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: stretch;
}

.teammate-panel {
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    overflow: auto;
    box-sizing: border-box;
}

/* Prevent Minnie content from enlarging its panel */
.teammate-panel .carousel-area2,
.teammate-panel .carousel-area3 {
    width: 100%;
    max-width: 100%;
    min-width: 0;
    height: 100%;
    box-sizing: border-box;
}

.teammate-panel .area3-photo img {
    display: block;
    width: 100%;
    max-width: 100%;
    height: 250px;
    object-fit: cover;
}
</style>
</head>
<body>
<h1>ShowTech | World's Tourist Attractions</h1>

<main class="destination-background" id="destinations">
    <div id="destination-rows"></div>


<div class="teammate-overlay">

    <!-- Area 2: preserve teammate section -->
    <section class="teammate-panel">
        <div class="carousel-area2">
            area2
        </div>
    </section>

    <!-- Area 3: Minnie server -->
    <section class="teammate-panel">
        <div class="carousel-area3">

            <div class="area3-slide1">
                <div class="area3-photo">
                    <img
                        src="https://www.servethehome.com/wp-content/uploads/2020/07/Project-TinyMiniMicro-HPE-ProLiant-MicroServer-Gen10-Plus-and-TMM-Nodes.jpg"
                        alt="Minnie server">
                </div>

                <div class="area3-description">
                    <header>Minnie</header>
                    <p>Minnie is a personal internet server.</p>
                    <p>More descriptions to be added...</p>
                </div>
            </div>

            <div class="area3-button">
                <button id="next">Next</button>
                <button id="previous">Previous</button>
            </div>

        </div>
    </section>

</div>

    </div>
</main>

<script>
const galleryPages = [
    "index.html",
    "page2.html",
    "page3.html",
    "page4.html",
    "page5.html",
    "page6.html",
    "page7.html",
    "page8.html"
];

const rows = document.getElementById("destination-rows");

Promise.all(galleryPages.map(async (page) => {
    const response = await fetch("tourism-gallery/" + page);
    if (!response.ok) {
        throw new Error("Cannot load " + page);
    }
    const html = await response.text();
    const doc = new DOMParser().parseFromString(html, "text/html");
    return Array.from(doc.querySelectorAll("main img")).slice(0, 12)
        .map(img => ({
            src: img.getAttribute("src"),
            alt: img.getAttribute("alt") || "Destination"
        }));
})).then(groups => {
    groups.forEach((images, index) => {
        const row = document.createElement("div");
        row.className = "destination-row";

        images.forEach(image => {
            const link = document.createElement("a");
            link.href = "tourism-gallery/" + galleryPages[index];

            const photo = document.createElement("img");
            photo.src = "tourism-gallery/" + image.src;
            photo.alt = image.alt;
            photo.loading = "lazy";

            link.appendChild(photo);
            row.appendChild(link);
        });

        rows.appendChild(row);
    });
}).catch(error => {
    rows.textContent = "Unable to load gallery: " + error.message;
});
</script>
</body>
</html>
